<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Vídeos com HTML5</title>
</head>
<body>
   <h1>Inserindo vídeos hospedados localmente</h1>
   <p>Este vídeo está hospedado no meu próprio servidor</p>
   <video  width="500" controls poster="thumb.jpg"> 
    <source src="video/meu-videos.mp4" type="video/mp4">
    <source src="video/meu-videos.m4v" type="video/mp4">
    <source src="video/meu-videos.webm" type="video/webm">
    <source src="video/meu-videos.ogv" type="video/ogv">
    <p>Seu navegador não tem compatibilidade com reprodução de vídeo.</p>
   </video>

   <video src="video/video_original.mp4" width="500" controls poster="imagem/thumb.jpg"> </video>

   <h1>Inseri vídeos do YouTube</h1>
   <iframe width="560" height="315" src="https://www.youtube.com/embed/4FXOYMNGtKI?si=CzVLglwrn39HBYhF" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
