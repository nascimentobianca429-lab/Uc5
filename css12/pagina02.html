<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagem/favicon.ico" type="image/x-icon">
    <title>Exemplode houver</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        div > p {
           display:none;
        }
        div:hover > p {
            display: block;
            color: white;
            background-color: red;
        }
        div:hover{
          color:red
        }
    </style>
</head>
<body>
  <h1>Exemplo de houver</h1>
  <p>Passe o mause sobre o texto abaixo</p>
  
  <div>
    Passe o mause aqui!
    <p>TEXTO ESCONDIDO... <p>
  </div> 
  <p>Fim do exemplo</p>
</body>
</html>
