<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Document</title>
</head>
<body>
   <h1>Trabalho com lista</h1>
   <h2>Lista ordenadas</h2>
   <ol type="A">                      <!-- Ordem lista - Lista Ordenadas -->
    <li>Acordar</li>
    <li>Tomar café</li>
    <li>Escova os dentes</li>
    <li>Mexer no celular</li>

   </ol> 
   <h2>Lista não ordenadas</h2>
   <ul type="disk">                 <!-- Lista não ordenadas (saque,disk,circle)-->
    <li>Estudar</li>
    <li>Almoçar</li>
    <li>Descansar</li>
    <li>Jantar</li>
   </ul>
</body>
</html>
