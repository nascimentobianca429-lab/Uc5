<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagem/favicon.ico" type="image/x-icon">
    <title>Pseudo-Elementos</title>
 <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }
    a{
        color: red;
        text-decoration: none;
        font-weight: bold;
    }
    a:visited{
        color: darkred;
    }
    a:hover{
        color: black;
        text-decoration: underline;
    }
    a:active{
        color: yellow;
    }
    a::after{
        content: '<-';
    }
    a::before{
        counter-reset: '->';
    }
    /*SELETORES PERSONALIZADOS
    # = id
    . = class
    : = pseudo-class
    :: = pseudo-elment
    > = childen
    */
 </style>
</head>
<body>
 <h1>Presonalizando link</h1>
 <ul>
    <li><a href="#">Repositorio do GitHub</a></li>
    <li><a href="#">Canal do Youtube</a></li>
    <li><a href="#">Portifólio</a></li>
 </ul>  
</body>
</html>
